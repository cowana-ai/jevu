[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevu"
version = "0.1.0"
description = "Erase a target concept from text embeddings, labeled zero-shot with laya."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chingis Oinar" }]
keywords = ["embeddings", "debiasing", "fairness", "concept-erasure", "inlp", "leace", "laya"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
laya = ["laya>=0.4", "tqdm>=4.60"]          # local, free zero-shot concept labeling via laya (+ progress)
openai = ["openai>=1.0"]                     # LLM concept expansion (expand=True)
examples = [                                 # run the example notebooks (incl. local embeddings)
    "laya>=0.4", "sentence-transformers>=2.2", "tqdm>=4.60", "openai>=1.0",
    "pandas>=1.3", "matplotlib>=3.5", "jupyter",
]
dev = [                                      # everything for development (tests + notebooks)
    "pytest>=7", "laya>=0.4", "sentence-transformers>=2.2", "tqdm>=4.60", "openai>=1.0",
    "pandas>=1.3", "matplotlib>=3.5", "jupyter",
]

[project.urls]
Homepage = "https://github.com/cowana-ai/jevu"
Issues = "https://github.com/cowana-ai/jevu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jevu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
